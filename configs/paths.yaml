# web2robot 路径配置 —— 全工程唯一允许出现绝对路径的地方
#
# 重构前有 40 个 .py 文件里散着 "/mnt/vlm/fanshaoheng" 字面量，
# 这是"换机器/搬目录就全碎"的根源。所有代码一律通过
#   from web2robot.paths import P
# 取路径，不再写死。换机器时只改这一个文件。
#
# 相对路径以本仓库根目录为基准；写绝对路径也支持。
# 格式用 YAML 而不是 TOML：三个 venv 都是 python 3.10（无 stdlib tomllib），
# 而 rt_env / perception_env 里没有 tomli，且这是共享机器不能随便装包。
# PyYAML 6.0.3 三个环境都有。

roots:
  # 第三方仓库（external/ 下是指向它们的 symlink，内容不改）
  egoinfinity: external/EgoInfinity
  hawor:       external/HaWoR
  # 归档：重构前的探索性目录，只读留档
  archive_hand_projects: ../hand_projects
  archive_phase1_repro:  ../phase1_repro
  # 官方源片段（EgoInfinity 自带的 examples/，属于第三方 checkout 的数据目录）。
  # 每个片段是 4 个输入文件：depth.mp4 / hand_joints.bin / hand_meta.json / scene.json。
  # 注册在这里是为了**代码不再用相对路径引它** —— 上游的路径都是相对
  # retarget/ 算的，薄壳一 cd 进去，我们的 --out 也会跟着落在里面（见
  # paths.py::check_output_dir 里记的 408 MB 那件事）。
  egoinfinity_clips: external/EgoInfinity/retarget/examples

envs:
  # 三个 venv 是 symlink，实体在旧目录（21 GB / 14 万文件，不可搬移：
  # bin/ 里是绝对路径 shebang，pyvenv.cfg 的 home= 还串成了链
  # gs3dgs_env -> hand2robot/env -> rt_env）。依赖清单见 envs/requirements-*.txt。
  # 必须用绝对路径调用解释器：这台机器上 conda activate 不生效。
  retarget:   envs/rt_env/bin/python          # 重定向 + 质检（jax/mujoco/torch/ultralytics）
  hawor:      envs/hawor_env/bin/python       # HaWoR SLAM 手部
  perception: envs/perception_env/bin/python  # WiLoR + MoGe

weights:
  # YOLO 手部检测器：HaWoR 与 EgoInfinity 两处是同一个文件，都列出按顺序找
  hand_detector:
    - external/HaWoR/weights/external/detector.pt
    - external/EgoInfinity/pretrained_models/detector.pt
  wilor_ckpt:   external/EgoInfinity/pretrained_models/wilor_final.ckpt
  wilor_config: external/EgoInfinity/configs/wilor_model_config.yaml
  # M7 根模型（root frame 的流匹配模型）—— 重定向的**输入**，不是产物。
  # 它躺在 external/ 下是因为上游 train.py 把训练 run 写进自己的 runs/：
  # runs/m7/taskspace_v2/ = checkpoints + tfevents + train.log。留在原地，
  # 但代码通过这个键取，不再写 `--ckpt runs/m7/...` 这种相对路径。
  m7_root_model: external/EgoInfinity/retarget/runs/m7/taskspace_v2/checkpoints/final.pt
  # torchvision 下载 KeypointRCNN 权重的落地点
  # （共享机器上别用默认 ~/.cache，别人也在用同一个 HOME）
  torch_home:   assets/weights

assets:
  m7_mjcf:   assets/robots/m7/m7.xml
  m7_mjx:    assets/robots/m7/m7_mjx.xml
  m7_urdf:   assets/robots/m7/m7_from_urdf.urdf
  m7_scene:  assets/robots/m7/scene_vis.xml
  m7_meshes: assets/robots/m7/meshes
  # L3.4（rel3_4）—— 第二台机器人。整个目录由 scripts/dev/build_l3_4_assets.py
  # 从 assets/robots/urdf.tar.gz 生成（**别手改**，改了就重跑那个脚本）。
  # 上肢和 M7 逐位同构，腿/腰/颈锁死，见 src/web2robot/robots/l3_4/。
  l3_4_mjcf:   assets/robots/l3_4/l3_4.xml
  l3_4_mjx:    assets/robots/l3_4/l3_4_mjx.xml
  l3_4_urdf:   assets/robots/l3_4/l3_4_from_urdf.urdf
  l3_4_scene:  assets/robots/l3_4/scene_vis.xml
  l3_4_meshes: assets/robots/l3_4/meshes
  # 厂家原包（l3.4.xml / l3_4.urdf / m7.urdf 各一份），是上面那个目录的唯一来源
  l3_4_src_tar: assets/robots/urdf.tar.gz

data:
  videos:  data/videos     # symlink -> hand_projects/hand2robot/videos
  outputs: outputs
  # 重定向产物的落点。上游 test.py 的 --out 默认值是 <clip_parent>/<robot>/
  # ——"把产物写在输入素材旁边"——薄壳会用这个目录顶掉那个默认值。
  retarget_out: outputs/retarget
  # 2026-08-10 从 external/ 搬出来的存量产物，保持原相对路径，见其中的 MANIFEST.tsv
  legacy_runs:  outputs/legacy_runs
